name: FINORA CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, integrate-zip-field-model]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Production build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run build
